<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QS | كيو الاحترافي</title>
    <!-- استدعاء مكتبة Tailwind CSS للتصميم الاحترافي -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #030712; color: #f9fafb; }
        .glass-card { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .gold-gradient { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
    </style>
</head>
<body class="pb-24 antialiased">

    <!-- الهيدر العلوي -->
    <header class="flex justify-between items-center p-4 glass-card border-b border-gray-800 sticky top-0 z-50">
        <button onclick="checkUpdate()" class="text-xs bg-blue-500/10 text-blue-400 border border-blue-500/20 px-3 py-1.5 rounded-xl font-medium transition active:scale-95">
            تحديث ⚡
        </button>
        <div class="flex items-center gap-3">
            <div class="text-right">
                <h1 class="text-sm font-bold text-white">QS | كيو</h1>
                <p class="text-[10px] text-gray-400">حساب موثق ✓</p>
            </div>
            <div class="w-10 h-10 rounded-full gold-gradient p-0.5 flex items-center justify-center shadow-lg shadow-amber-500/20">
                <div class="w-full h-full bg-gray-900 rounded-full flex items-center justify-center font-bold text-amber-400 text-sm">QS</div>
            </div>
        </div>
    </header>

    <!-- المحتوى الأساسي -->
    <main class="p-4 max-w-md mx-auto space-y-4">
        
        <!-- قسم الأرصدة -->
        <div class="grid grid-cols-2 gap-3">
            <div class="glass-card p-4 rounded-2xl relative overflow-hidden">
                <div class="absolute -left-4 -bottom-4 w-16 h-16 bg-amber-500/10 rounded-full blur-xl"></div>
                <span class="text-xs text-gray-400 block mb-1">عملة الصقر</span>
                <div class="text-xl font-black text-amber-400 flex items-center gap-1.5">
                    <span id="falcon-coins">15</span> <span class="text-sm">🦅</span>
                </div>
            </div>
            <div class="glass-card p-4 rounded-2xl relative overflow-hidden">
                <div class="absolute -left-4 -bottom-4 w-16 h-16 bg-emerald-500/10 rounded-full blur-xl"></div>
                <span class="text-xs text-gray-400 block mb-1">الأرباح (USDT)</span>
                <div class="text-xl font-black text-emerald-400">$0.00 <span class="text-xs">💎</span></div>
            </div>
        </div>

        <!-- بطاقة الإعلانات أو التفاعل -->
        <div class="glass-card p-5 rounded-2xl border-amber-500/20">
            <h2 class="text-sm font-bold mb-2 text-amber-300 flex items-center gap-2">
                <span>🚀</span> البداية السريعة
            </h2>
            <p class="text-xs text-gray-400 mb-4 leading-relaxed">هذا القالب مصمم بمستوى شركات برمجية ليكون خفيفاً وسريع الاستجابة على هواتف الجيل الجديد.</p>
            <button onclick="showAlert()" class="w-full gold-gradient text-gray-950 font-bold py-3 px-4 rounded-xl shadow-lg shadow-amber-600/20 transition transform active:scale-95 text-sm">
                استلم مكافأة اليوم ✨
            </button>
        </div>

        <!-- قائمة الخدمات -->
        <div class="glass-card p-4 rounded-2xl space-y-2">
            <div class="flex items-center justify-between p-3 bg-gray-900/50 rounded-xl border border-white/5">
                <span class="text-xs font-medium">بطاقات الهدايا الرقمية</span>
                <span class="text-xs bg-amber-500/20 text-amber-400 px-2.5 py-1 rounded-lg">قريباً</span>
            </div>
            <div class="flex items-center justify-between p-3 bg-gray-900/50 rounded-xl border border-white/5">
                <span class="text-xs font-medium">نظام الإحالات والأصدقاء</span>
                <span class="text-xs bg-emerald-500/20 text-emerald-400 px-2.5 py-1 rounded-lg">مفعل</span>
            </div>
        </div>

    </main>

    <!-- شريط التنقل السفلي الاحترافي -->
    <nav class="fixed bottom-0 left-0 right-0 glass-card border-t border-gray-800 p-2 flex justify-around items-center z-50 max-w-md mx-auto rounded-t-2xl">
        <button class="flex flex-col items-center gap-1 text-gray-400 hover:text-amber-400 transition text-[11px]">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            <span>الرصيد</span>
        </button>
        <button class="flex flex-col items-center gap-1 text-gray-400 hover:text-amber-400 transition text-[11px]">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
            <span>المتجر</span>
        </button>
        <button class="flex flex-col items-center gap-1 text-amber-400 transition text-[11px]">
            <div class="w-11 h-11 gold-gradient rounded-full flex items-center justify-center text-gray-950 shadow-lg shadow-amber-500/30 -mt-5 border-4 border-gray-950">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
            </div>
            <span>الرئيسية</span>
        </button>
        <button class="flex flex-col items-center gap-1 text-gray-400 hover:text-amber-400 transition text-[11px]">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
            <span>المهام</span>
        </button>
        <button class="flex flex-col items-center gap-1 text-gray-400 hover:text-amber-400 transition text-[11px]">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            <span>حسابي</span>
        </button>
    </nav>

    <script>
        let coins = 15;
        function showAlert() {
            coins += 5;
            document.getElementById('falcon-coins').innerText = coins;
            alert('🎉 مبروك! تمت إضافة 5 صقر إلى رصيدك بنجاح.');
        }
        function checkUpdate() {
            alert('التطبيق يعمل بأحدث إصدار رسمي.');
        }
    </script>
</body>
</html>
